spring:
  application:
    name: food
  datasource:
    url: jdbc:h2:~/OrderFood;NON_KEYWORDS=KEY
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456
  h2:
    console:
      enabled: true                   # 开启H2控制台
      path: /h2-console               # 控制台访问路径（默认/h2-console）
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

server:
  http2:
    enabled: true
  port: 8081

sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Token
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# 业务自定义配置
food:
  ip-audit:
    # 是否解析并保存客户端 IP 位置信息（ip2region 离线库）
    # 关闭时：IP、UA 照常保存，IP 位置字段落库为 null
    enabled: true
    # ip2region xdb 库文件所在目录（https://gitee.com/lionsoul/ip2region）
    # 相对路径基于进程工作目录（本地开发即 food 模块根目录）；生产用 IP2REGION_XDB_DIR 覆盖
    xdb-dir: ${IP2REGION_XDB_DIR:ip}
    # IPv4 / IPv6 库文件名
    v4-file-name: ip2region_v4.xdb
    v6-file-name: ip2region_v6.xdb
  sms:
    # 短信发送通道：
    #   log     = 打印到后端日志（当前测试用，默认）
    #   aliyun  = 后续接入阿里云短信（新增 AliyunSmsSender 后切换为该值）
    #   tencent = 后续接入腾讯云短信
    provider: log
  verify-code:
    # 验证码有效期（秒），默认 5 分钟
    expire-seconds: 300
    # 同一手机号同一场景最短重发间隔（秒）
    resend-interval-seconds: 60
    # 验证码位数
    length: 6
