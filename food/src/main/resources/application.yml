spring:
  application:
    name: food
  datasource:
    url: jdbc:h2:~/OrderFood;NON_KEYWORDS=KEY
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456
  h2:
    console:
      enabled: true                   # 开启H2控制台
      path: /h2-console               # 控制台访问路径（默认/h2-console）
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  http2:
    enabled: true
  port: 8081
